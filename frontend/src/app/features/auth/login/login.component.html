<div class="w-full">

  <!-- Back link -->
  <a routerLink="/"
     class="inline-flex items-center gap-2 text-sm text-zinc-500 dark:text-zinc-400 hover:text-brand-500 dark:hover:text-brand-400 transition-colors mb-8">
    <lucide-icon [img]="ArrowLeft" class="w-4 h-4"></lucide-icon>
    Volver al inicio
  </a>

  <app-card variant="default">

    <!-- Logo + Título -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-blue-700 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand-500/30">
        <lucide-icon [img]="Shield" class="w-7 h-7 text-white"></lucide-icon>
      </div>
      <h1 class="text-2xl font-bold text-zinc-900 dark:text-zinc-100 mb-1">
        Bienvenido de vuelta
      </h1>
      <p class="text-sm text-zinc-500 dark:text-zinc-400">
        Ingresa tus credenciales para continuar
      </p>
    </div>

    <!-- Banner de error -->
    @if (errorMessage()) {
      <div class="mb-5 p-3 rounded-lg bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 flex items-start gap-2">
        <svg class="w-4 h-4 text-red-500 mt-0.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
        </svg>
        <p class="text-xs text-red-700 dark:text-red-400 leading-relaxed">
          {{ errorMessage() }}
        </p>
      </div>
    }

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">

      <app-input
        label="Usuario"
        placeholder="admin"
        formControlName="username"
        [required]="true"
        [iconLeft]="UserIcon"
        autocomplete="username"
        [errorMsg]="usernameError"
      />

      <app-input
        label="Contraseña"
        type="password"
        placeholder="••••••••"
        formControlName="password"
        [required]="true"
        [iconLeft]="Lock"
        autocomplete="current-password"
        [errorMsg]="passwordError"
      />

      <!-- Remember me + Forgot password -->
      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input
            type="checkbox"
            formControlName="rememberMe"
            class="w-4 h-4 rounded border-zinc-300 dark:border-zinc-700 text-brand-500 accent-brand-500 cursor-pointer"
          />
          <span class="text-xs text-zinc-600 dark:text-zinc-400">Recordarme</span>
        </label>
        <button
          type="button"
          class="text-xs text-brand-500 hover:text-brand-600 transition-colors"
          (click)="notify.info('Próximamente', 'Esta función estará disponible pronto')"
        >
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [iconRight]="ArrowRight"
        [fullWidth]="true"
        [loading]="loading()"
        [disabled]="loading()"
      >
        @if (loading()) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }
      </app-button>

    </form>

    <!-- Footer de la card -->
    <div class="mt-6 pt-6 border-t border-zinc-200 dark:border-zinc-800 text-center">
      <p class="text-xs text-zinc-400 dark:text-zinc-500">
        Acceso solo para administradores
      </p>
    </div>

  </app-card>

  <p class="text-center text-xs text-zinc-400 dark:text-zinc-500 mt-6">
    © {{ year }} DMAN Systems · Todos los derechos reservados
  </p>

</div>
