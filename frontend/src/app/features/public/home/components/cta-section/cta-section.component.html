<section class="py-24">
  <div class="container-custom">

    <div class="relative max-w-4xl mx-auto">
      <!-- Glow de fondo -->
      <div class="absolute inset-0 bg-gradient-to-br from-brand-500/20 via-blue-500/10 to-purple-500/20 rounded-3xl blur-3xl"></div>

      <div class="relative bg-white dark:bg-zinc-900 border border-brand-500/30 rounded-3xl p-10 md:p-16 text-center overflow-hidden shadow-xl shadow-brand-500/10">

        <!-- Blobs decorativos -->
        <div class="absolute -top-24 -right-24 w-64 h-64 rounded-full bg-brand-500/20 blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-64 h-64 rounded-full bg-purple-500/20 blur-3xl pointer-events-none"></div>

        <div class="relative">

          <!-- Título -->
          <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight leading-[1.1] mb-4 text-zinc-900 dark:text-zinc-100">
            ¿Listo para transformar
            <br class="hidden sm:block" />
            tu
            <span class="bg-gradient-to-r from-brand-500 to-purple-500 bg-clip-text text-transparent">
              negocio
            </span>
            ?
          </h2>

          <!-- Subtítulo -->
          <p class="text-zinc-600 dark:text-zinc-400 max-w-md mx-auto mb-8 leading-relaxed">
            Conversemos sobre tu proyecto. Primera consulta sin costo y sin compromisos.
          </p>

          <!-- Botones -->
          <div class="flex flex-wrap items-center justify-center gap-3">
            <app-button
              variant="primary"
              size="lg"
              [iconRight]="ArrowRight"
              routerLink="/contacto"
            >
              Cotizar mi proyecto
            </app-button>

            <a
              [href]="whatsappUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg shadow-lg shadow-green-500/30 hover:shadow-green-500/50 transition-all duration-200 active:scale-[0.98]"
            >
              <lucide-icon [img]="MessageCircle" class="w-5 h-5"></lucide-icon>
              WhatsApp
            </a>
          </div>

          <!-- Mini badges de confianza -->
          <div class="flex flex-wrap items-center justify-center gap-6 mt-10 pt-8 border-t border-zinc-200 dark:border-zinc-800">
            <div class="flex items-center gap-2 text-sm text-zinc-600 dark:text-zinc-400">
              <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
              Disponibles ahora
            </div>
            <div class="text-sm text-zinc-500 dark:text-zinc-500">
              Respuesta en &lt; 24h
            </div>
            <div class="text-sm text-zinc-500 dark:text-zinc-500">
              Sin compromiso
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</section>
