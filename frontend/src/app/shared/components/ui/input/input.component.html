<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="controlId" class="text-sm font-medium text-zinc-700 dark:text-zinc-300">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </label>
  }

  <div class="relative">
    @if (iconLeft()) {
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <lucide-icon
          [img]="iconLeft()"
          class="w-4 h-4 text-zinc-400 dark:text-zinc-500"
        ></lucide-icon>
      </div>
    }

    <input
      [id]="controlId"
      [type]="inputType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabledState()"
      [attr.aria-label]="label() || placeholder() || 'Entrada de texto'"
      [autocomplete]="autocomplete()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      (focus)="onFocus()"
      [class]="
        'w-full px-4 py-2.5 rounded-lg text-sm transition-all duration-200 ' +
        'bg-white text-zinc-900 placeholder-zinc-400 ' +
        'dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder-zinc-500 ' +
        'border focus:outline-none focus:ring-2 ' +
        (iconLeft() ? 'pl-10 ' : '') +
        (type() === 'password' ? 'pr-10 ' : '') +
        (hasError()
          ? 'border-red-500 focus:ring-red-500/20 focus:border-red-500 '
          : 'border-zinc-200 dark:border-zinc-800 focus:border-brand-500 focus:ring-brand-500/20 ') +
        (disabledState() ? 'opacity-50 cursor-not-allowed' : '')
      "
    />

    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePassword()"
        class="absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300"
      >
        @if (showPassword()) {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        } @else {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        }
      </button>
    }
  </div>

  @if (hasError() && errorMsg()) {
    <span class="text-xs text-red-500 flex items-center gap-1">
      <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
      </svg>
      {{ errorMsg() }}
    </span>
  } @else if (hint()) {
    <span class="text-xs text-zinc-500 dark:text-zinc-500">{{ hint() }}</span>
  }
</div>
