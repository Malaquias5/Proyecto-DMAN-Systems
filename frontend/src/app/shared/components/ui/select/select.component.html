<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="controlId" class="text-sm font-medium text-zinc-700 dark:text-zinc-300">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </label>
  }

  <div class="relative">
    <select
      [id]="controlId"
      [value]="value() ?? ''"
      [disabled]="disabledState()"
      [attr.aria-label]="label() || placeholder() || 'Seleccion'"
      (change)="onChangeSelect($event)"
      (blur)="onBlur()"
      [class]="
        'w-full px-4 py-2.5 pr-10 rounded-lg text-sm appearance-none cursor-pointer transition-all duration-200 ' +
        'bg-white text-zinc-900 ' +
        'dark:bg-zinc-900 dark:text-zinc-100 ' +
        'border focus:outline-none focus:ring-2 ' +
        (hasError()
          ? 'border-red-500 focus:ring-red-500/20 focus:border-red-500 '
          : 'border-zinc-200 dark:border-zinc-800 focus:border-brand-500 focus:ring-brand-500/20 ') +
        (disabledState() ? 'opacity-50 cursor-not-allowed' : '')
      "
    >
      <option value="" disabled>{{ placeholder() }}</option>
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>

    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
      <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </div>

  @if (hasError() && errorMsg()) {
    <span class="text-xs text-red-500">{{ errorMsg() }}</span>
  }
</div>
