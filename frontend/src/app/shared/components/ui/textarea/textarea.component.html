<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="controlId" class="text-sm font-medium text-zinc-700 dark:text-zinc-300">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </label>
  }

  <textarea
    [id]="controlId"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabledState()"
    [attr.aria-label]="label() || placeholder() || 'Area de texto'"
    [rows]="rows()"
    [maxLength]="maxLength()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    [class]="
      'w-full px-4 py-2.5 rounded-lg text-sm transition-all duration-200 resize-y ' +
      'bg-white text-zinc-900 placeholder-zinc-400 ' +
      'dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder-zinc-500 ' +
      'border focus:outline-none focus:ring-2 ' +
      (hasError()
        ? 'border-red-500 focus:ring-red-500/20 focus:border-red-500 '
        : 'border-zinc-200 dark:border-zinc-800 focus:border-brand-500 focus:ring-brand-500/20 ') +
      (disabledState() ? 'opacity-50 cursor-not-allowed' : '')
    "
  ></textarea>

  <div class="flex justify-between items-center">
    <div>
      @if (hasError() && errorMsg()) {
        <span class="text-xs text-red-500">{{ errorMsg() }}</span>
      } @else if (hint()) {
        <span class="text-xs text-zinc-500">{{ hint() }}</span>
      }
    </div>
    @if (maxLength()) {
      <span class="text-xs text-zinc-500">{{ charCount() }}/{{ maxLength() }}</span>
    }
  </div>
</div>
